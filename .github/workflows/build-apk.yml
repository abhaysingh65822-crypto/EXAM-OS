name: Build EXAM OS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build EXAM OS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Extract EXAM OS project
        shell: bash
        run: |
          set -e

          ZIP_FILE="EXAM_OS_GITHUB_READY.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found."
            ls -la
            exit 1
          fi

          rm -rf _exam_os_build
          mkdir -p _exam_os_build

          unzip -q "$ZIP_FILE" -d _exam_os_build

          echo "=== Extracted project ==="
          find _exam_os_build -maxdepth 4 -type f | sort

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE="$(find _exam_os_build -type f \( \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' \
          \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No Gradle settings file found."
            find _exam_os_build -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Gradle project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify toolchain
        shell: bash
        run: |
          java -version
          gradle --version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "Building from:"
          pwd

          echo "Project files:"
          ls -la

          gradle --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK_FILE="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR" -type f | sort
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EXAM_OS_APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30
