name: Build EXAM OS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract EXAM OS project
        run: |
          unzip -q EXAM_OS_GITHUB_READY.zip
          echo "Project extracted:"
          ls -la exam_os_upgrade

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        working-directory: exam_os_upgrade
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EXAM-OS-debug-APK
          path: exam_os_upgrade/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
